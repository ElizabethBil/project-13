<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Pasteles</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>¡Bienvenido a nuestra tienda de pasteles!</h1>
        <nav>
            <ul>
                <li><a href="#about">Sobre nosotros</a></li>
                <li><a href="#products">Pasteles</a></li>
                <li><a href="#contact">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <section id="about">
        <h2>Sobre nosotros</h2>
        <p>¡Hacemos los pasteles más deliciosos por encargo para cualquier ocasión!</p>
    </section>
    <section id="products">
        <h2>Nuestros Pasteles</h2>
        <p>¡Pronto estarán disponibles para comprar!</p>

        <div class="cake-gallery">
            <img src="images/tort1.jpg" alt="Pastel 1" class="cake-image">
            <img src="images/tort2.jpg" alt="Pastel 2" class="cake-image">
            <img src="images/tort3.jpg" alt="Pastel 3" class="cake-image">
        </div>

        <button id="orderButton">Ordenar pastel</button>
    </section>
    <footer>
        <h2 id="contact">Contacto</h2>
        <p>Correo electrónico: info@pasteles.com</p>
    </footer>
    <script src="script.js"></script>
</body>

</html>
